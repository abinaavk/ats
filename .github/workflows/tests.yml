name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pyyaml psutil prometheus_client
      - name: Every module compiles
        run: python -m compileall -q .
      # ATS is root-only (it refuses to start otherwise), so its suite runs as root, as it does on a server.
      - name: Unit tests
        run: sudo -E env "PATH=$PATH" python -m unittest discover -s tests
